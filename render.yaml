services:
  - type: web
    name: lakbay-api
    runtime: python
    plan: free
    region: singapore
    rootDir: services/api
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/v1/health
    envVars:
      - key: APP_NAME
        value: Lakbay API
      - key: APP_ENV
        value: production
      - key: API_V1_PREFIX
        value: /api/v1
      - key: TIMEZONE
        value: Asia/Manila
      - key: DEBUG
        value: "false"
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: ADMIN_REGISTRATION_CODE
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: FALLBACK_LLM_API_KEY
        sync: false
      - key: FALLBACK_LLM_MODEL
        value: gemini-3.5-flash-lite
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: CLOUDINARY_UPLOAD_FOLDER
        value: lakbay
      - key: GOOGLE_OAUTH_CLIENT_IDS
        sync: false
      # Road routing: Mapbox first (set the secret in the dashboard), OSRM fallback.
      - key: MAPBOX_DIRECTIONS_TOKEN
        sync: false
      - key: OSRM_BASE_URL
        value: https://router.project-osrm.org

  - type: web
    name: lakbay-admin
    runtime: static
    rootDir: apps/admin_app
    buildCommand: ""
    staticPublishPath: build/web
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
