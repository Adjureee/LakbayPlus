<?xml version="1.0" encoding="UTF-8"?>
<!--
  Lakbay+ wordmark: the original compass mark (see lakbay_mark.svg) beside
  the name, with the "+" in the brand's secondary color. Hand-authored for
  this project; the <text> below renders with the system/generic sans-serif
  fallback, so this file never embeds a third-party font.

  The in-app render is lib/widgets/brand/lakbay_wordmark.dart, which pairs
  LakbayCompassMark with Flutter's own text styling (Outfit via
  google_fonts) so weight and color follow the app's theme.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 64">
  <g transform="translate(0,0)">
    <path fill="#20878E" d="M32,32 L29.2,23.4 L32,4 L34.8,23.4 Z" />
    <path fill="#20878E" d="M32,32 L40.6,29.2 L60,32 L40.6,34.8 Z" />
    <path fill="#20878E" d="M32,32 L34.8,40.6 L32,60 L29.2,40.6 Z" />
    <path fill="#20878E" d="M32,32 L23.4,34.8 L4,32 L23.4,29.2 Z" />
    <path fill="#8FC3C6" d="M32,32 L36.1,24.0 L44.7,19.3 L40.0,27.9 Z" />
    <path fill="#8FC3C6" d="M32,32 L40.0,36.1 L44.7,44.7 L36.1,40.0 Z" />
    <path fill="#8FC3C6" d="M32,32 L27.9,40.0 L19.3,44.7 L24.0,36.1 Z" />
    <path fill="#8FC3C6" d="M32,32 L24.0,27.9 L19.3,19.3 L27.9,24.0 Z" />
    <circle cx="32" cy="32" r="5" fill="#20878E" />
  </g>
  <text x="74" y="41" font-family="sans-serif" font-size="30" font-weight="800"
        letter-spacing="-0.6" fill="#16696F">Lakbay<tspan fill="#D66F29">+</tspan></text>
</svg>
