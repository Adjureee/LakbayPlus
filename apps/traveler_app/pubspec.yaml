name: lakbay_travel
description: "Lakbay+ — Davao Region (Region XI) AI Travel Companion & Route Planner."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.14.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.0
  http: ^1.6.0
  shared_preferences: ^2.3.0
  geolocator: ^14.1.2
  google_sign_in: ^7.2.0
  speech_to_text: ^7.5.0
  image_picker: ^1.2.4
  path_provider: ^2.1.6
  share_plus: ^13.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - .env
    - assets/icons/
    - assets/home_backdrops/
    - assets/data/
    - assets/onboarding/
    - assets/chatbot/quick/
    - assets/videos/
    - assets/png/weather/
    - assets/trip_icons/
    - assets/map_sprites/
    # Bundled Google Fonts (Manrope, Bricolage Grotesque): google_fonts loads
    # these instead of downloading them, so the app works offline.
    - assets/google_fonts/

  fonts:
    # Bricolage Grotesque ExtraBold (OFL) under a const-friendly family name.
    # Manrope is the default UI font through the theme (google_fonts, bundled).
    - family: LakbayDisplay
      fonts:
        - asset: assets/google_fonts/BricolageGrotesque-ExtraBold.ttf
          weight: 800
